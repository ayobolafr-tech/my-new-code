<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Knowledge Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background: white;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background: green;width:100%;max-width:500px;border-radius:16px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h1{text-align:center;margin-bottom:10px}
p.subtitle{text-align:center;color: purple;margin-bottom:20px}
.question{font-size:18px;font-weight:bold;margin:15px 0}
.options button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;background: white;text-align:left;cursor:pointer}
.options button:hover{background: purple}
.options button.correct{background:blue!important;border-color:red}
.options button.wrong{background:red!important;border-color:dark}
.controls{display:flex;justify-content:space-between;margin-top:15px}
#nextBtn,#startBtn{padding:10px 20px;background:#0d6efd;color:white;border:none;border-radius:8px;cursor:pointer}
#scoreBox{text-align:center;font-size:20px;padding:20px;display:none}
.progress{height:6px;background:#eee;border-radius:10px;margin-bottom:15px;overflow:hidden}
#progressBar{height:100%;background:#0d6efd;width:0%;transition:0.3s}
</style>
</head>
<body>
<div class="card">
<h1>🧠 Interactive App</h1>
<p class="subtitle">General Knowledge ©2026</p>
<div class="progress"><div id="progressBar"></div></div>
<div id="quizArea">
<div id="startScreen" style="text-align:center">
<p> You are welcome❤️
    ,Test your knowledge with the following questions💪</p><br>
<button id="startBtn">Start Quiz👌👍</button>
</div>
<div id="questionScreen" style="display:none">
<div class="question" id="questionText"></div>
<div class="options" id="optionsBox"></div>
<div class="controls"><span id="qNumber"></span><button id="nextBtn">Next</button></div>
</div>
<div id="scoreBox"></div>
</div>
</div>
<script>
const questions=[
{q:"What is the capital of Nigeria?",a:["Lagos","Abuja","Port Harcourt","Kano"],c:1},
{q:"How many continents are there?",a:["5","6","7","8"],c:2},
{q:"Who invented WWW?",a:["Bill Gates","Tim Berners-Lee","Steve Jobs","Mark Zuckerberg"],c:1},

{q:"What is the full meaning of js?",a:["Lagos","JavaScript","Port Harcourt","Kano"],c:1},
{q:"How many days are there in a week?",a:["5","6","7","8"],c:2},
{q:"What is the meaning of www?",a:["We Will Win ","World Wide Web","work with web","watch what you watch"],c:1},
{q:"Largest ocean in the world?",a:["Atlantic","Indian","Pacific","Arctic"],c:2},
{q:"What does CPU stand for?",a:["Central Process Unit","Central Processing Unit","Computer Processing Unit","Central Program Unit"],c:1},
{q:"Which planet is known as Red Planet?",a:["Venus","Jupiter","Mars","Saturn"],c:2},
{q:"Nigeria gained independence in?",a:["1959","1960","1963","1970"],c:1},
{q:"HTML is used for?",a:["Styling","Structure of webpage","Programming logic","Database"],c:1},
{q:"Fastest land animal?",a:["Lion","Cheetah","Tiger","Leopard"],c:1},
{q:"How many sides does a hexagon have?",a:["5","6","7","8"],c:1},
{q:"Which language runs in a browser?",a:["Python","Java","C++","JavaScript"],c:3},
{q:"The River Niger flows into?",a:["Atlantic Ocean","Pacific Ocean","Mediterranean","Lake Chad"],c:0},
{q:"What is 15 x 4?",a:["45","60","50","65"],c:1},
{q:"Which company created Android?",a:["Apple","Microsoft","Google","IBM"],c:2},
{q:"Chemical symbol for water?",a:["H2O","O2","CO2","HO"],c:0},
{q:"Which continent is Nigeria in?",a:["Asia","Africa","Europe","South America"],c:1},
{q:"CSS stands for?",a:["Computer Style Sheet","Cascading Style Sheets","Creative Style System","Colorful Style Sheet"],c:1},
{q:"How many hours in a day?",a:["12","24","48","36"],c:1},
{q:"Largest organ in human body?",a:["Heart","Brain","Skin","Liver"],c:2},
{q:"What year did WWW begin?",a:["1989","1995","2000","1990"],c:0},
{q:"Largest ocean in the world?",a:["Atlantic","Indian","Pacific","Arctic"],c:2},
{q:"2 + 2 x 2 = ?",a:["6","8","4","10"],c:0},
{q:"The current president of Nigeria is?",a:["Muhammed Buhari","Seni Abacha","Bola Ahmed Tinubu","Ibrahim Babangida"],c:2},
{q:"In the beginning the Lord created?",a:["heaven and earth","water and sand","man and woman","light and dark"],c:0},
{q:"For God so love the world can be found in?", a:[" Luke 11:14","Mathew 3:16","John 16:3","John 3:16"],c:3},
{q:"The bones that form acetabulum are?",a:["ilium-ipium-isthium","Talu-tibia-femor","lumba-sacra-thorax","fibula-hallu-tarsa"],c:0},
{q:"The smallest unit of life?",a:["atom","molecule","organ","cell"],c:3}
];
let current=0,score=0;
const startScreen=document.getElementById('startScreen');
const questionScreen=document.getElementById('questionScreen');
const questionText=document.getElementById('questionText');
const optionsBox=document.getElementById('optionsBox');
const qNumber=document.getElementById('qNumber');
const progressBar=document.getElementById('progressBar');
const scoreBox=document.getElementById('scoreBox');
const nextBtn=document.getElementById('nextBtn');

document.getElementById('startBtn').addEventListener('click',()=>{
 startScreen.style.display='none';
 questionScreen.style.display='block';
 showQuestion();
});

function showQuestion(){
 let q=questions[current];
 questionText.textContent=q.q;
 optionsBox.innerHTML='';
 qNumber.textContent=`Question ${current+1} / ${questions.length}`;
 progressBar.style.width=`${((current)/questions.length)*100}%`;
 q.a.forEach((opt,i)=>{
  let btn=document.createElement('button');
  btn.textContent=opt;
  btn.addEventListener('click',()=>checkAnswer(i,btn));
  optionsBox.appendChild(btn);
 });
 nextBtn.style.display='none';
}

function checkAnswer(selected,btn){
 let correct=questions[current].c;
 let allBtns=optionsBox.querySelectorAll('button');
 allBtns.forEach(b=>b.disabled=true);
 if(selected===correct){score++;btn.classList.add('correct');}
 else{btn.classList.add('wrong');allBtns[correct].classList.add('correct');}
 nextBtn.style.display='block';
}

nextBtn.addEventListener('click',()=>{
 current++;
 if(current<questions.length){showQuestion();}
 else{showResult();}
});

function showResult(){
 questionScreen.style.display='none';
 progressBar.style.width='100%';
 scoreBox.style.display='block';
 scoreBox.innerHTML=`<h2>You scored ${score} / ${questions.length}</h2><p>${score>=25?'Excellent! 🏆🎉':score>=15?'Good job! 👍':'Dont be discouraged 🤔keep practicing💝!'}</p><br><button id="startBtn" onclick="location.reload()">Restart💪</button>`;
}
</script>
</body>
</html>
